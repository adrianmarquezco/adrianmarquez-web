name: Vigilante adrianmarquez.es

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: vigilante-adrianmarquez
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  vigilante:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Intento 1 ───────────────────────────────────────────────────────────

      - name: HTTP check (1)
        id: http1
        run: python .monitoring/check_http.py 2>&1 | tee /tmp/http.log
        continue-on-error: true

      - name: Instalar Playwright y Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Browser check (1)
        id: browser1
        run: python .monitoring/check_browser.py 2>&1 | tee /tmp/browser.log
        continue-on-error: true
        env:
          PW_CHANNEL: ${{ vars.PW_CHANNEL }}

      # ── Reintento a los 90 s si algo falló ──────────────────────────────────

      - name: Esperar 90 s antes del reintento
        if: steps.http1.outcome == 'failure' || steps.browser1.outcome == 'failure'
        run: sleep 90

      - name: HTTP check (reintento)
        id: http2
        if: steps.http1.outcome == 'failure'
        run: python .monitoring/check_http.py 2>&1 | tee /tmp/http.log
        continue-on-error: true

      - name: Browser check (reintento)
        id: browser2
        if: steps.browser1.outcome == 'failure'
        run: python .monitoring/check_browser.py 2>&1 | tee /tmp/browser.log
        continue-on-error: true
        env:
          PW_CHANNEL: ${{ vars.PW_CHANNEL }}

      # ── Resultado y gestión de issue ────────────────────────────────────────

      - name: Evaluar resultado y gestionar issue
        if: always()
        uses: actions/github-script@v7
        env:
          HTTP1:    ${{ steps.http1.outcome }}
          HTTP2:    ${{ steps.http2.outcome }}
          BROWSER1: ${{ steps.browser1.outcome }}
          BROWSER2: ${{ steps.browser2.outcome }}
        with:
          script: |
            const fs = require('fs');

            const httpOk    = process.env.HTTP1    === 'success' || process.env.HTTP2    === 'success';
            const browserOk = process.env.BROWSER1 === 'success' || process.env.BROWSER2 === 'success';
            const hasFail   = !httpOk || !browserOk;

            let log = '';
            try { log += fs.readFileSync('/tmp/http.log',    'utf8').slice(-3000); } catch(e) {}
            try { log += '\n' + fs.readFileSync('/tmp/browser.log', 'utf8').slice(-2000); } catch(e) {}

            const LABEL = 'vigilante';
            const TITLE = 'ALERTA: adrianmarquez.es tiene problemas';
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const now   = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Crear etiqueta si no existe
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'cc0000',
                description: 'Alerta automática del vigilante'
              });
            } catch(e) { /* ya existe */ }

            // Buscar issue abierta
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, labels: LABEL, state: 'open', per_page: 10
            });
            const existing = issues.find(i => i.title === TITLE);

            if (hasFail) {
              const body = [
                `**Detección:** ${now}`,
                `**Run:** ${runUrl}`,
                '',
                '```',
                log.slice(0, 4000),
                '```'
              ].join('\n');

              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo,
                  issue_number: existing.number,
                  body: `Sigue fallando (${now})\n\n${body}`
                });
                console.log(`Comentario añadido a issue #${existing.number}`);
              } else {
                const { data: newIssue } = await github.rest.issues.create({
                  owner, repo, title: TITLE, body, labels: [LABEL]
                });
                console.log(`Issue abierta: #${newIssue.number}`);
              }
              core.setFailed('La web tiene problemas. Ver issue para el detalle.');
            } else {
              console.log('Todos los checks OK.');
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo,
                  issue_number: existing.number,
                  body: `La web ha vuelto a funcionar correctamente (${now}). Run: ${runUrl}`
                });
                await github.rest.issues.update({
                  owner, repo,
                  issue_number: existing.number,
                  state: 'closed'
                });
                console.log(`Issue #${existing.number} cerrada.`);
              }
            }
