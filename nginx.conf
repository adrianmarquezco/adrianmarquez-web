server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/html text/css application/javascript application/json application/xml;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Cabeceras de seguridad. Ningún location define add_header propio (usan expires),
    # así que todas se heredan en cada respuesta.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://formspree.io" always;

    # Ficheros internos y ocultos
    location = /nginx.conf       { return 404; }
    location = /Dockerfile       { return 404; }
    location = /README.md        { return 404; }
    location ~ ^/n8n/            { return 404; }
    location ^~ /.well-known/    { try_files $uri =404; }
    location ~ /\.               { return 404; }

    # 301: URLs antiguas o duplicadas
    location = /retiro { return 301 /retiro.html; }
    location = /blog/n8n-make-zapier-automatizacion-pymes-servicios.html { return 301 /blog/automatizar-procesos-pyme-servicios-herramientas-ia.html; }
    location = /sectores/automatizacion-abogados.html { return 301 /sectores/abogados-despachos/automatizacion/; }
    location = /sectores/automatizacion-academias.html { return 301 /sectores/academias-formacion/automatizacion/; }
    location = /sectores/automatizacion-asesorias.html { return 301 /sectores/asesorias-despachos/automatizacion/; }
    location = /sectores/automatizacion-clinicas.html { return 301 /sectores/clinicas-salud/automatizacion/; }
    location = /sectores/automatizacion-estetica.html { return 301 /sectores/estetica-peluquerias/automatizacion/; }
    location = /sectores/automatizacion-hosteleria.html { return 301 /sectores/hosteleria/automatizacion/; }
    location = /sectores/automatizacion-inmobiliarias.html { return 301 /sectores/inmobiliarias/automatizacion/; }
    location = /sectores/automatizacion-psicologos.html { return 301 /sectores/psicologos-terapeutas/automatizacion/; }
    location = /sectores/automatizacion-reformas.html { return 301 /sectores/reformas-construccion/automatizacion/; }
    location = /sectores/google-ads-abogados.html { return 301 /sectores/abogados-despachos/google-ads/; }
    location = /sectores/google-ads-academias.html { return 301 /sectores/academias-formacion/google-ads/; }
    location = /sectores/google-ads-asesorias.html { return 301 /sectores/asesorias-despachos/google-ads/; }
    location = /sectores/google-ads-clinicas.html { return 301 /sectores/clinicas-salud/google-ads/; }
    location = /sectores/google-ads-estetica.html { return 301 /sectores/estetica-peluquerias/google-ads/; }
    location = /sectores/google-ads-inmobiliarias.html { return 301 /sectores/inmobiliarias/google-ads/; }
    location = /sectores/google-ads-psicologos.html { return 301 /sectores/psicologos-terapeutas/google-ads/; }
    location = /sectores/google-ads-reformas.html { return 301 /sectores/reformas-construccion/google-ads/; }
    location = /sectores/seo-abogados.html { return 301 /sectores/abogados-despachos/seo/; }
    location = /sectores/seo-academias.html { return 301 /sectores/academias-formacion/seo/; }
    location = /sectores/seo-asesorias.html { return 301 /sectores/asesorias-despachos/seo/; }
    location = /sectores/seo-clinicas.html { return 301 /sectores/clinicas-salud/seo/; }
    location = /sectores/seo-estetica.html { return 301 /sectores/estetica-peluquerias/seo/; }
    location = /sectores/seo-hosteleria.html { return 301 /sectores/hosteleria/seo/; }
    location = /sectores/seo-inmobiliarias.html { return 301 /sectores/inmobiliarias/seo/; }
    location = /sectores/seo-psicologos.html { return 301 /sectores/psicologos-terapeutas/seo/; }
    location = /sectores/seo-reformas.html { return 301 /sectores/reformas-construccion/seo/; }
    location = /sectores/web-abogados.html { return 301 /sectores/abogados-despachos/diseno-web/; }
    location = /sectores/web-academias.html { return 301 /sectores/academias-formacion/diseno-web/; }
    location = /sectores/web-asesorias.html { return 301 /sectores/asesorias-despachos/diseno-web/; }
    location = /sectores/web-clinicas.html { return 301 /sectores/clinicas-salud/diseno-web/; }
    location = /sectores/web-inmobiliarias.html { return 301 /sectores/inmobiliarias/diseno-web/; }

    # HTML, CSS y JS: el navegador siempre comprueba si hay versión nueva
    location ~* \.(html|css|js)$ {
        expires -1;
    }

    # Imágenes y fuentes: caché larga
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 1y;
    }

    location = /llms.txt {
        types { }
        default_type "text/plain; charset=utf-8";
        expires 1d;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
