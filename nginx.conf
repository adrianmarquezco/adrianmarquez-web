server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CSS y JS: el navegador siempre comprueba si hay versión nueva
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Imágenes y fuentes: caché larga (no cambian sin renombrar el fichero)
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML: sin caché
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
