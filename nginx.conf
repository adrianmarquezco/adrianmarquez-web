server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CSS y JS: el navegador siempre comprueba si hay versión nueva
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Imágenes y fuentes: caché larga (no cambian sin renombrar el fichero)
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML: sin caché
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # 301 redirects — intersection pages moved to hierarchical structure
    rewrite ^/sectores/automatizacion-abogados\.html$    /sectores/abogados-despachos/automatizacion/    permanent;
    rewrite ^/sectores/automatizacion-academias\.html$   /sectores/academias-formacion/automatizacion/   permanent;
    rewrite ^/sectores/automatizacion-asesorias\.html$   /sectores/asesorias-despachos/automatizacion/   permanent;
    rewrite ^/sectores/automatizacion-clinicas\.html$    /sectores/clinicas-salud/automatizacion/        permanent;
    rewrite ^/sectores/automatizacion-estetica\.html$    /sectores/estetica-peluquerias/automatizacion/  permanent;
    rewrite ^/sectores/automatizacion-hosteleria\.html$  /sectores/hosteleria/automatizacion/            permanent;
    rewrite ^/sectores/automatizacion-inmobiliarias\.html$ /sectores/inmobiliarias/automatizacion/       permanent;
    rewrite ^/sectores/automatizacion-psicologos\.html$  /sectores/psicologos-terapeutas/automatizacion/ permanent;
    rewrite ^/sectores/automatizacion-reformas\.html$    /sectores/reformas-construccion/automatizacion/ permanent;
    rewrite ^/sectores/google-ads-abogados\.html$        /sectores/abogados-despachos/google-ads/        permanent;
    rewrite ^/sectores/google-ads-academias\.html$       /sectores/academias-formacion/google-ads/       permanent;
    rewrite ^/sectores/google-ads-asesorias\.html$       /sectores/asesorias-despachos/google-ads/       permanent;
    rewrite ^/sectores/google-ads-clinicas\.html$        /sectores/clinicas-salud/google-ads/            permanent;
    rewrite ^/sectores/google-ads-estetica\.html$        /sectores/estetica-peluquerias/google-ads/      permanent;
    rewrite ^/sectores/google-ads-inmobiliarias\.html$   /sectores/inmobiliarias/google-ads/             permanent;
    rewrite ^/sectores/google-ads-psicologos\.html$      /sectores/psicologos-terapeutas/google-ads/     permanent;
    rewrite ^/sectores/google-ads-reformas\.html$        /sectores/reformas-construccion/google-ads/     permanent;
    rewrite ^/sectores/seo-abogados\.html$               /sectores/abogados-despachos/seo/               permanent;
    rewrite ^/sectores/seo-academias\.html$              /sectores/academias-formacion/seo/              permanent;
    rewrite ^/sectores/seo-asesorias\.html$              /sectores/asesorias-despachos/seo/              permanent;
    rewrite ^/sectores/seo-clinicas\.html$               /sectores/clinicas-salud/seo/                   permanent;
    rewrite ^/sectores/seo-estetica\.html$               /sectores/estetica-peluquerias/seo/             permanent;
    rewrite ^/sectores/seo-hosteleria\.html$             /sectores/hosteleria/seo/                       permanent;
    rewrite ^/sectores/seo-inmobiliarias\.html$          /sectores/inmobiliarias/seo/                    permanent;
    rewrite ^/sectores/seo-psicologos\.html$             /sectores/psicologos-terapeutas/seo/            permanent;
    rewrite ^/sectores/seo-reformas\.html$               /sectores/reformas-construccion/seo/            permanent;
    rewrite ^/sectores/web-abogados\.html$               /sectores/abogados-despachos/diseno-web/        permanent;
    rewrite ^/sectores/web-academias\.html$              /sectores/academias-formacion/diseno-web/       permanent;
    rewrite ^/sectores/web-asesorias\.html$              /sectores/asesorias-despachos/diseno-web/       permanent;
    rewrite ^/sectores/web-clinicas\.html$               /sectores/clinicas-salud/diseno-web/            permanent;
    rewrite ^/sectores/web-inmobiliarias\.html$          /sectores/inmobiliarias/diseno-web/             permanent;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
